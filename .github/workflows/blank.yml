name: Network Monitor CI

on:
  push:
    branches:
      - feature
      - 'feature/**'
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# Cancel older runs on the same branch/PR when newer commits arrive.
concurrency:
  group: network-monitor-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Read only by default. Only the PR-creation job can write pull requests.
permissions:
  contents: read

jobs:
  configuration:
    name: '01 - Configuration & safety'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r tests/requirements.txt
      - name: Validate YAML, scrape jobs, exporters and target templates
        run: python -m unittest discover -s tests -p 'test_configuration.py' -v
      - name: Check for committed secrets and local-only files
        run: python -m unittest discover -s tests -p 'test_repository_safety.py' -v
      - name: Report stage
        if: always()
        run: |
          echo '### 01 - Configuration & safety' >> "$GITHUB_STEP_SUMMARY"
          echo 'Validated YAML, monitoring topology, example targets and checked for sensitive local files.' >> "$GITHUB_STEP_SUMMARY"

  dashboards:
    name: '02 - Grafana dashboards'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r tests/requirements.txt
      - name: Validate dashboard JSON, layout and data sources
        run: python -m unittest discover -s tests -p 'test_dashboards.py' -v
      - name: Report stage
        if: always()
        run: |
          echo '### 02 - Grafana dashboards' >> "$GITHUB_STEP_SUMMARY"
          echo 'Validated all committed dashboard JSON, panel references, variables and Prometheus datasource provisioning.' >> "$GITHUB_STEP_SUMMARY"

  prometheus:
    name: '03 - Prometheus & alert rules'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate Prometheus configuration with promtool
        run: |
          docker run --rm --entrypoint=/bin/promtool \
            -v "$PWD/prometheus:/etc/prometheus:ro" \
            prom/prometheus:latest \
            check config /etc/prometheus/prometheus.yml
      - name: Validate every alert rule file with promtool
        run: |
          shopt -s nullglob
          rules=(prometheus/rules/*.yml)
          if (( ${#rules[@]} == 0 )); then
            echo 'No alert rule files found.' >&2
            exit 1
          fi
          for rule in "${rules[@]}"; do
            echo "Checking ${rule}"
            docker run --rm --entrypoint=/bin/promtool \
              -v "$PWD/prometheus:/etc/prometheus:ro" \
              prom/prometheus:latest \
              check rules "/etc/prometheus/rules/$(basename "$rule")"
          done
      - name: Report stage
        if: always()
        run: |
          echo '### 03 - Prometheus & alert rules' >> "$GITHUB_STEP_SUMMARY"
          echo 'Ran official promtool validation against the scrape configuration and every alert rule file.' >> "$GITHUB_STEP_SUMMARY"

  compose:
    name: '04 - Docker Compose readiness'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # CI-only dummy substitutions. Never use production passwords in CI.
      GRAFANA_PORT: '3000'
      GRAFANA_ADMIN_USER: 'ci-admin'
      GRAFANA_ADMIN_PASSWORD: 'not-a-real-secret-ci-only'
      SMTP_HOST: 'smtp.example.invalid:587'
      SMTP_USER: 'ci-user'
      SMTP_PASSWORD: 'not-a-real-secret-ci-only'
      SMTP_FROM_ADDRESS: 'alerts@example.invalid'
      SMTP_FROM_NAME: 'Network Monitor CI'
      PROMETHEUS_PORT: '9090'
      PROMETHEUS_RETENTION: '15d'
      SNMP_EXPORTER_PORT: '9116'
      BLACKBOX_EXPORTER_PORT: '9115'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Docker Compose syntax and substitutions
        run: docker compose config --quiet
      - name: Validate rendered service topology
        run: |
          docker compose config --format json > /tmp/network-monitor-compose.json
          python - <<'PY'
          import json
          from pathlib import Path
          doc = json.loads(Path('/tmp/network-monitor-compose.json').read_text())
          services = doc['services']
          required = {'grafana', 'prometheus', 'snmp-exporter', 'blackbox-exporter'}
          assert required <= services.keys(), f'Missing services: {required - services.keys()}'
          for name in required:
              assert services[name]['image'], f'{name} has no image'
          assert any('/etc/prometheus/targets' in mount.get('target', '')
                     for mount in services['prometheus'].get('volumes', [])), 'Target discovery directory is not mounted'
          print('Services and Prometheus target mount validated')
          PY
      - name: Report stage
        if: always()
        run: |
          echo '### 04 - Docker Compose readiness' >> "$GITHUB_STEP_SUMMARY"
          echo 'Checked Compose syntax, CI-only variable substitutions, services and target-directory mounts. No live deployment.' >> "$GITHUB_STEP_SUMMARY"

  quality-gate:
    name: '05 - Quality gate'
    runs-on: ubuntu-latest
    needs: [configuration, dashboards, prometheus, compose]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Summarise checks and enforce quality gate
        env:
          CONFIGURATION: ${{ needs.configuration.result }}
          DASHBOARDS: ${{ needs.dashboards.result }}
          PROMETHEUS: ${{ needs.prometheus.result }}
          COMPOSE: ${{ needs.compose.result }}
        run: |
          {
            echo '## Network Monitor - review readiness'
            echo ''
            echo '| Stage | Result |'
            echo '| --- | --- |'
            echo "| Configuration & safety | ${CONFIGURATION} |"
            echo "| Grafana dashboards | ${DASHBOARDS} |"
            echo "| Prometheus & rules | ${PROMETHEUS} |"
            echo "| Docker Compose readiness | ${COMPOSE} |"
            echo ''
            echo 'This pipeline does **not** deploy, approve or merge anything. Human approval must be enforced with a main-branch ruleset.'
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$CONFIGURATION" != success || "$DASHBOARDS" != success || "$PROMETHEUS" != success || "$COMPOSE" != success ]]; then
            echo 'Quality gate FAILED. Review failed stages before merging.' >&2
            exit 1
          fi
          echo 'Quality gate passed. The changes are ready for human review.'

  open-review-pr:
    name: '06 - Open/reuse review PR'
    # Do not run on PRs: these triggers have read-only permissions by design.
    # Open a draft even if tests fail: reviewers can inspect failed stages on the PR.
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/feature'
    needs: [quality-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check for an existing feature -> main PR
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          url=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --head feature --base main --json url --jq '.[0].url // ""')
          echo "url=$url" >> "$GITHUB_OUTPUT"
          if [[ -n "$url" ]]; then
            echo "Existing PR: $url" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Open draft PR if none exists
        if: steps.existing.outputs.url == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main --head feature --draft \
            --title 'Review Network Monitor feature changes' \
            --body $'## Purpose\nChanges proposed from `feature` to `main`.\n\n## Reviewer checklist\n- [ ] Examine the changed configuration and dashboards\n- [ ] Inspect all CI stage results and the Quality gate\n- [ ] Verify no local credentials, internal target inventory or database files are included\n- [ ] Manually approve the PR before merging\n\n**This workflow never merges or deploys automatically.**'
      - name: PR creation guidance
        if: always()
        run: |
          echo '### PR review' >> "$GITHUB_STEP_SUMMARY"
          echo 'Use Settings > Actions > General > Allow GitHub Actions to create and approve pull requests if this job reports permission denied.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Also require a reviewer and successful checks on main through a branch ruleset.' >> "$GITHUB_STEP_SUMMARY"
